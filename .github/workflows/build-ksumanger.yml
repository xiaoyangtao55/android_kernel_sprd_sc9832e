name: Build KSU-Manager

on:
  push:
    branches: [ "lineage-17.1" ]
    paths:
      - '.github/workflows/build-ksumanger.yml'
      - 'KernelSU/manager/**'
      - 'KernelSU/repack_apk.py'
  pull_request:
    branches: [ "lineage-17.1" ]
    paths:
      - '.github/workflows/build-ksumanger.yml'
      - 'KernelSU/manager/**'
      - 'KernelSU/repack_apk.py'
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./KernelSU/manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/lineage-17.1' )) }}
        run: |
            {
              echo KEYSTORE_PASSWORD='password'
              echo KEY_ALIAS='alias'
              echo KEY_PASSWORD='password'
              echo KEYSTORE_FILE='dummy.keystore'
            } >> gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ secrets.PR_KEYSTORE || '' }}
          PR_KEYSTORE_PASSWORD: ${{ secrets.PR_KEYSTORE_PASSWORD || '' }}
          PR_KEY_PASSWORD: ${{ secrets.PR_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$PR_KEYSTORE" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            {
              echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
              echo KEY_ALIAS='pr-key'
              echo KEY_PASSWORD="$PR_KEY_PASSWORD"
              echo KEYSTORE_FILE='pr-key.jks'
            } >> gradle.properties
          else
            {
              echo KEYSTORE_PASSWORD='password'
              echo KEY_ALIAS='alias'
              echo KEY_PASSWORD='password'
              echo KEYSTORE_FILE='dummy.keystore'
            } >> gradle.properties
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify minSdk configuration
        run: |
          echo "=== MinSdk Configuration ==="
          grep "androidMinSdkVersion" build.gradle.kts
          grep "androidTargetSdkVersion" build.gradle.kts
          grep "androidCompileSdkVersion" build.gradle.kts

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease --stacktrace -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease --stacktrace
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: app/build/outputs/apk/release/*.apk
