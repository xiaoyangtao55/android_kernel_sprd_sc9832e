name: Build KSU-Manager

on:
  push:
    branches: [ "lineage-17.1" ]
  pull_request:
    branches: [ "lineage-17.1" ]
  workflow_dispatch:

# KernelSU is vendored into this kernel tree as a plain directory, so its own CI lives at
# KernelSU/.github/workflows/ and never runs here -- GitHub only reads .github/workflows/ at the
# repository root, and those files reference "./.github/workflows/*.yml" relative to the root.
# This workflow reproduces the essential pipeline of KernelSU's build-manager.yml:
#
#   version ──> build-manager (Gradle APK) ──┐
#           └─> build-ksud    (Rust ksud)  ──┴─> repack-manager (inject libksud.so, align, resign)
#
# The installable APK is the "manager" artifact from repack-manager. The intermediate
# "manager-gradle" artifact is NOT usable on its own: libksud.so is gitignored, no Gradle task
# builds it, the kernel module does not embed it, and the app looks it up at
# nativeLibraryDir/libksud.so (KsuCli.kt, AppZygotePreload.java).
#
# This is a non-GKI kernel (4.4, CONFIG_KSU=y built in), so KernelSU's build-lkm / build-ksuinit
# / build-ksud-extra jobs are intentionally not reproduced.

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.read.outputs.code }}
      name: ${{ steps.read.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `git rev-list --count HEAD` would count this kernel repository's squashed history
      # (39 commits -> version code 29944) instead of KernelSU's (-> 32628). Pinning code and name
      # from SOURCE_REVISION keeps manager, ksud and the kernel module (-DKSU_VERSION=32628)
      # in agreement, and avoids INSTALL_FAILED_VERSION_DOWNGRADE when upgrading an existing
      # manager install.
      - name: Read KernelSU/SOURCE_REVISION
        id: read
        run: |
          code=$(sed -n 's/^KSU_VERSION=//p' KernelSU/SOURCE_REVISION | tr -d '[:space:]')
          name=$(sed -n 's/^SOURCE_TAG=//p' KernelSU/SOURCE_REVISION | tr -d '[:space:]')
          if [ -z "$code" ]; then
            echo "::error::KSU_VERSION missing from KernelSU/SOURCE_REVISION"
            exit 1
          fi
          if [ -z "$name" ]; then
            name="v$code"
            echo "::warning::SOURCE_TAG missing from KernelSU/SOURCE_REVISION, using $name"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Pinned KSU version: code=$code name=$name"

  build-ksud:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    env:
      KSU_VERSION_CODE: ${{ needs.version.outputs.code }}
      KSU_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      # Required: ksud's build.rs assembles an AArch64 bootstrap object with the NDK clang, and
      # bindgen needs libclang for the Android targets.
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source KernelSU/.github/scripts/setup-rust-build.sh ${{ matrix.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./KernelSU/userspace/ksud/Cargo.toml
          # cargo puts target/ at the workspace root, i.e. KernelSU/target/ (not the repo root).
          file "KernelSU/target/${{ matrix.target }}/release/ksud"

      - name: Upload ksud
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ matrix.target }}
          path: KernelSU/target/${{ matrix.target }}/release/ksud

  build-manager:
    needs: version
    runs-on: ubuntu-latest
    env:
      KSU_VERSION_CODE: ${{ needs.version.outputs.code }}
      KSU_VERSION_NAME: ${{ needs.version.outputs.name }}
    defaults:
      run:
        working-directory: ./KernelSU/manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check files exist
        run: |
          ls -la gradlew
          ls -la gradle.properties
          ls -la dummy.keystore
          ls -la gradle/wrapper/gradle-wrapper.jar
          pwd

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/lineage-17.1' )) }}
        run: |
            echo "android.experimental.enableNewResourceShrinker.preciseShrinking=true" > gradle.properties
            echo "android.enableAppCompileTimeRClass=true" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.suppressUnsupportedCompileSdk=37.0" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
            echo "org.gradle.parallel=true" >> gradle.properties
            echo "org.gradle.tooling.parallel=true" >> gradle.properties
            echo "org.gradle.vfs.watch=true" >> gradle.properties
            echo "android.r8.maxWorkers=4" >> gradle.properties
            echo "android.native.buildOutput=verbose" >> gradle.properties
            echo "KEYSTORE_PASSWORD=password" >> gradle.properties
            echo "KEY_ALIAS=alias" >> gradle.properties
            echo "KEY_PASSWORD=password" >> gradle.properties
            echo "KEYSTORE_FILE=dummy.keystore" >> gradle.properties
            cat gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ secrets.PR_KEYSTORE || '' }}
          PR_KEYSTORE_PASSWORD: ${{ secrets.PR_KEYSTORE_PASSWORD || '' }}
          PR_KEY_PASSWORD: ${{ secrets.PR_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$PR_KEYSTORE" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "android.experimental.enableNewResourceShrinker.preciseShrinking=true" > gradle.properties
            echo "android.enableAppCompileTimeRClass=true" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.suppressUnsupportedCompileSdk=37.0" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
            echo "org.gradle.parallel=true" >> gradle.properties
            echo "org.gradle.tooling.parallel=true" >> gradle.properties
            echo "org.gradle.vfs.watch=true" >> gradle.properties
            echo "android.r8.maxWorkers=4" >> gradle.properties
            echo "android.native.buildOutput=verbose" >> gradle.properties
            echo "KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> gradle.properties
            echo "KEY_ALIAS=pr-key" >> gradle.properties
            echo "KEY_PASSWORD=$PR_KEY_PASSWORD" >> gradle.properties
            echo "KEYSTORE_FILE=pr-key.jks" >> gradle.properties
          else
            echo "android.experimental.enableNewResourceShrinker.preciseShrinking=true" > gradle.properties
            echo "android.enableAppCompileTimeRClass=true" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.suppressUnsupportedCompileSdk=37.0" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
            echo "org.gradle.parallel=true" >> gradle.properties
            echo "org.gradle.tooling.parallel=true" >> gradle.properties
            echo "org.gradle.vfs.watch=true" >> gradle.properties
            echo "android.r8.maxWorkers=4" >> gradle.properties
            echo "android.native.buildOutput=verbose" >> gradle.properties
            echo "KEYSTORE_PASSWORD=password" >> gradle.properties
            echo "KEY_ALIAS=alias" >> gradle.properties
            echo "KEY_PASSWORD=password" >> gradle.properties
            echo "KEYSTORE_FILE=dummy.keystore" >> gradle.properties
          fi
          cat gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify minSdk configuration
        run: |
          echo "=== MinSdk Configuration ==="
          grep "androidMinSdkVersion" build.gradle.kts
          grep "androidTargetSdkVersion" build.gradle.kts
          grep "androidCompileSdkVersion" build.gradle.kts

      - name: Build with Gradle
        run: |
          ./gradlew clean assembleRelease --stacktrace
        env:
          IS_PR_BUILD: "false"

      - name: Check APK exists
        run: |
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "APK not found"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manager-gradle
          path: KernelSU/manager/app/build/outputs/apk/release/*.apk

  repack-manager:
    needs: [ version, build-manager, build-ksud ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download manager APK
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download ksud binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ksud-*
          path: artifacts/ksud

      # repack_apk.py resolves everything relative to its own directory (KernelSU/):
      #   KernelSU/manager/app/build/outputs/apk/release/*.apk
      #   KernelSU/target/<rust-target-triple>/release/ksud
      - name: Place artifacts
        run: |
          set -euo pipefail

          mkdir -p KernelSU/manager/app/build/outputs/apk/release
          apk=$(find artifacts/manager-gradle -type f -name '*.apk' | head -n1)
          test -n "$apk"
          cp -f "$apk" KernelSU/manager/app/build/outputs/apk/release/

          for triple in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            mkdir -p "KernelSU/target/$triple/release"
            ksud=$(find "artifacts/ksud/ksud-$triple" -type f -name ksud | head -n1)
            test -n "$ksud"
            cp -f "$ksud" "KernelSU/target/$triple/release/ksud"
          done

          ls -l KernelSU/manager/app/build/outputs/apk/release/
          find KernelSU/target -type f -name ksud

      # This is the step that was missing: it injects each ksud as lib/<abi>/libksud.so,
      # zipaligns to 16 KB pages and re-signs the APK.
      - name: Repack and resign
        working-directory: ./KernelSU
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -K manager/dummy.keystore \
            -A alias \
            -P password \
            -S password \
            --strip

      - name: Verify libksud.so is inside the APK
        run: |
          set -euo pipefail
          apk=$(find KernelSU/dist -maxdepth 1 -name '*.apk' | head -n1)
          test -n "$apk"
          echo "APK: $apk"
          count=$(unzip -l "$apk" | grep -cE 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libksud\.so')
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libksud\.so'
          test "$count" -eq 3

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: KernelSU/dist/*.apk
