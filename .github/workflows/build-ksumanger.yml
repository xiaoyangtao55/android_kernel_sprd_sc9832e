name: Build KSU-Manager

on:
  push:
    branches: [ "lineage-17.1" ]
  pull_request:
    branches: [ "lineage-17.1" ]
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./KernelSU/manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check files exist
        run: |
          ls -la gradlew
          ls -la gradle.properties
          ls -la dummy.keystore
          ls -la gradle/wrapper/gradle-wrapper.jar
          pwd

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/lineage-17.1' )) }}
        run: |
            cp gradle.properties gradle.properties.bak
            cat > gradle.properties << 'EOF'
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
KEYSTORE_PASSWORD=password
KEY_ALIAS=alias
KEY_PASSWORD=password
KEYSTORE_FILE=dummy.keystore
EOF
            cat gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ secrets.PR_KEYSTORE || '' }}
          PR_KEYSTORE_PASSWORD: ${{ secrets.PR_KEYSTORE_PASSWORD || '' }}
          PR_KEY_PASSWORD: ${{ secrets.PR_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$PR_KEYSTORE" ]; then
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            cat > gradle.properties << 'EOF'
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD
KEY_ALIAS=pr-key
KEY_PASSWORD=$PR_KEY_PASSWORD
KEYSTORE_FILE=pr-key.jks
EOF
          else
            cat > gradle.properties << 'EOF'
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
KEYSTORE_PASSWORD=password
KEY_ALIAS=alias
KEY_PASSWORD=password
KEYSTORE_FILE=dummy.keystore
EOF
          fi
          cat gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify minSdk configuration
        run: |
          echo "=== MinSdk Configuration ==="
          grep "androidMinSdkVersion" build.gradle.kts
          grep "androidTargetSdkVersion" build.gradle.kts
          grep "androidCompileSdkVersion" build.gradle.kts

      - name: Build with Gradle
        run: |
          ./gradlew clean assembleRelease --stacktrace
        env:
          IS_PR_BUILD: "false"

      - name: Check APK exists
        run: |
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "APK not found"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manager-gradle
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/*.mapping

      - name: Show minSdk in APK
        if: always()
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "Found APK: $APK"
            aapt dump badging "$APK" 2>/dev/null | grep -i "sdkVersion" || echo "aapt not available, trying aapt2"
          fi
